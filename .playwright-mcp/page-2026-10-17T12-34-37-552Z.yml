        - 'heading "Segurança Pública e eleições: sintomas de fragilidade democrática no Brasil" [level=1] [ref=e60]'
        - paragraph [ref=e61]: Como as operações policiais e o medo do crime se relacionam com o comportamento eleitoral
        - img "Como as operações policiais e o medo do crime se relacionam com o comportamento eleitoral" [ref=e62]
      - generic [ref=e63]:
        - blockquote [ref=e64]:
          - paragraph [ref=e65]:
            - strong [ref=e66]: Diego Arcanjo Campos, Mestrando em Ciência Política (IESP-UERJ)
        - paragraph [ref=e67]: A segurança pública no Brasil e na América Latina é um dos desafios institucionais e sociais mais complexos da atualidade. Historicamente marcada por abordagens reativas e pautadas no confronto direto, a gestão da ordem pública transita permanentemente entre a exigência de redução dos indicadores de criminalidade e a necessidade de assegurar os direitos fundamentais do cidadão. Às vésperas das eleições gerais que ocorrerão no próximo dia 4 de outubro, gostaria de abordar uma relação que é de extrema importância para o cidadão no cálculo que envolve o voto, ou seja, a relação entre segurança pública e comportamento eleitoral.
        - paragraph [ref=e68]: "A “Operação Contenção”, realizada em 28 de Outubro de 2025, nos Complexos do Alemão e da Penha (RJ), foi classificada pelo Dicionário de Favelas Marielle Franco como a operação policial mais letal da história do Rio de Janeiro. A operação, que ocorreu ainda durante a gestão do ex-governador Cláudio Castro, choca por seus números: foram 121 mortos e quase uma centena de prisões. A partir desses números, duas questões precisam ser destacadas. A primeira delas é que uma operação dessa envergadura impacta negativamente a população local, que já é vítima da vulnerabilidade socioeconômica e da gestão narcotraficante sobre o território, ao retirar deles o direito à circulação no território, e o direito de acesso aos poucos dispositivos onde o Estado se faz presente nessas localidades, como postos de saúde e escolas. A segunda questão diz respeito à ineficácia das chamadas mega operações (Barbosa et al., 2025; Deole, 2018; Monteiro e Rocha, 2017)."
        - paragraph [ref=e69]: Não é de hoje que a literatura das ciências sociais aponta a ineficácia das operações de repressão ao narcotráfico feitos com base no paradigma de Guerra às Drogas (Ferreira, 2020; Labrousse, 2010; Rodrigues,2012), no entanto, desde os anos 1980 com a ascensão das principais organizações narcotraficantes no Brasil, a tática permanece a mesma, e o crime organizado não apenas cresceu, mas se complexificou economicamente, diversificando suas formas de obtenção e lavagem de dinheiro, como foi observado a partir da operação interagências Carbono Oculto, em agosto de 2025, além de financiar braços atuantes na política, como exemplificado no caso dos ex-deputados da ALERJ Rodrigo Bacellar e TH Jóias.
        - paragraph [ref=e70]: É comum entre a população carioca a percepção de que as mega operações aconteçam às vésperas de períodos eleitorais, o que é confirmado em estudo da agência Rede de Observatórios de Segurança, que registrou alta de 18% nas operações policiais no segundo semestre de 2022, às vésperas das eleições. O mesmo estudo verifica a ocorrência do aumento no número de operações não apenas no Rio de Janeiro, mas também nos estados da Bahia, Pernambuco, Ceará e São Paulo. Essas operações, realizadas sob o governo de candidatos à esquerda e à direita do espectro político, funcionam como um aceno à população na tentativa de “mostrar serviço”, e refletem diretamente nas pesquisas sobre intenção de voto. No Rio de Janeiro, antes das operações na gestão Cláudio Castro, o ex-governador Wilson Witzel fez uso da mesma tática (Oliveira, 2022; Ramos, 2022).
        - paragraph [ref=e71]: Buscando entender tal fenômeno, algumas revisões de literatura nos ajudam a ter uma melhor compreensão do cenário. Mais além, literaturas relacionadas ao estudo da Guerra às Drogas, securitização e militarização da política também auxiliam a ter uma compreensão mais ampla do que leva ao aumento das operações policiais nas proximidades do período eleitoral (Hoecker e Verdes-Montenegro,2023).
        - paragraph [ref=e72]: De acordo com Cardoso e Borba (2022) a experiência concreta da violência e o medo do crime, experiências próximas mas não diretamente relacionadas, constituem terreno fértil para o populismo penal e discursos autoritários, exercendo impacto no comportamento eleitoral e na saúde da democracia. A revisão realizada pelos autores aponta para efeitos negativos da vitimização e do medo do crime na legitimidade democrática latino-americana.
        - paragraph [ref=e73]: "Ainda nesse estudo, os autores afirmam que o crime pode interferir nos resultados das eleições de modos distintos: através da decisão de comparecimento ou abstenção no pleito; os elevados níveis das taxas de crime, vitimização e insegurança, funcionam como combustível para o apoio a plataformas que defendem políticas alinhadas ao populismo penal; e ainda a vitimização e a insegurança afetam o apoio ao incumbente na tentativa de reeleição. Compreender esses resultados importa não apenas no que diz respeito ao apoio e confiança popular às instituições democráticas, mas também para o entendimento de uma das causas pelas quais as políticas de segurança pública, no momento, repetem o mesmo padrão de ação, e atentam para o uso indevido do poder de polícia por parte do poder político."
        - paragraph [ref=e74]: "A literatura sobre a relação entre política e segurança pública tem espaço e relevância para ser expandida, e é necessário que seja. Cabe nessa agenda de pesquisa, por exemplo, o acesso à segurança e o acesso à justiça como fatores que também estão implicados na tomada de decisão do eleitor. E essa é uma agenda que interessa não apenas à academia, mas igualmente ao cidadão brasileiro. A segurança pública é um direito de todos, e a compreensão da relação entre esse direito e o voto é essencial para a tomada de decisão do eleitor na escolha de seus representantes. Desenvolver essa agenda de pesquisa e fomentar o debate público ao redor dela evoca um dilema de interesse popular: como lutar contra o crime organizado e preservar direitos políticos e civis que são essenciais à democracia?"
