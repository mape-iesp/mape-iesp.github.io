  - status: "Revisão original"
    name: "Transferência de renda condicionada (apoio estudantil)"
    resultado: "Evasão escolar"
    effectDirection: "positivo"
    effectStrength: "indeterminado"
    implementationComplexity: "simples"
    implementationNotes: "Usa infraestruturas existentes (CadÚnico, Censo Escolar); o gargalo é verificar a frequência."
    costLevel: "variavel"
    costDescription: "Concentrado no valor transferido (US$5 a 200/mês, conforme o país); no Pé-de-Meia (R$200/mês), simulação ex-ante estima 0,7 p.p. a menos de evasão por R$1 mil investidos, mais que o dobro do necessário para compensar o custo social de R$384 mil por jovem sem ensino médio."
    summary: >
      Dos 11 estudos primários, 6 encontram efeito positivo, 4 nulo e 1 negativo; efeitos maiores onde a frequência de base é baixa e há barreiras econômicas (Camboja: ~25 p.p. na frequência; México: +8,6 a 9,2 p.p. na conclusão do ensino médio). Funciona melhor com condicionalidade, valor competitivo com o mercado de trabalho, repasse direto ao estudante e recebimento contínuo.
    dimensions:
      - "Educação"
    authors: "Carlos Freitas; Pedro Bahia"
    title: "Políticas de Transferência de Renda e Redução do Abandono Escolar"
    reviewDate: "10/8/2026"
    studyLink: "https://drive.google.com/file/d/15yFm_6_vWndzFVLorCJxtPku8TUvYoZT/view?usp=sharing"

