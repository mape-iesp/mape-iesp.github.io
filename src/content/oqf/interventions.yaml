  - status: "Revisão original"
    name: "Programas de segunda chance (EJA)"
    resultado: "Evasão escolar"
    effectDirection: "neutro"
    effectStrength: "indeterminado"
    implementationComplexity: "complexa"
    implementationNotes: "Oferta em horários e locais compatíveis com a rotina de trabalhadores e cuidadores e suporte material (transporte, alimentação, creche noturna)."
    costLevel: "baixo"
    costDescription: "Baixo por matrícula; os retornos da conclusão indicam custo-benefício favorável, frequentemente desperdiçado pelas baixas taxas de conclusão."
    summary: >
      Evidência predominantemente qualitativa (21 estudos), sem estimativas causais; conciliação estudo–trabalho–família e origem social são os principais determinantes da evasão (20 de 21 estudos). Funciona melhor com currículo adaptado à vida adulta, professores com formação para EJA, busca ativa de faltosos, formatos híbridos com tutoria, vínculo com oportunidades de emprego e apoio ao cuidado infantil.
    dimensions:
      - "Educação"
    authors: "Jorge Lucas Nery de Oliveira; Frederico Augusto Auad de Gomes Filho"
    title: "Determinantes de Sucesso da Educação de Jovens e Adultos"
    reviewDate: "10/8/2026"
