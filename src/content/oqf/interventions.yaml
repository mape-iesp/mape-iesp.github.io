    costDescription: "Baixo a médio, administrativo e operacional; a transparência ativa tende a reduzir a demanda por pedidos individuais."
    summary: >
      Efeitos sobretudo institucionais: a LAI institucionalizou o direito de acesso, expandiu a transparência ativa e passiva e alterou práticas de gestão da informação. Os efeitos são heterogêneos e predominantemente qualitativos; disponibilizar informação não garante accountability nem redução de irregularidades.
