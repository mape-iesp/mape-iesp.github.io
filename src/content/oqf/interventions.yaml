    effectDirection: "positivo"
    effectStrength: "indeterminado"
    implementationComplexity: "moderada"
    implementationNotes: "Regulamentação local, portal de transparência ativa, canal de pedidos (SIC) e capacidade operacional, às vezes com apoio da CGU."
